# Test configuration.
# A test-classpath application.properties shadows src/main/resources/application.properties
# entirely rather than merging with it, so every property the context needs is listed here.
# All values are dummies - no test may reach a real MongoDB, apifootball, OpenAI or Resend.

spring.data.mongodb.uri=mongodb://localhost:27017/small-talk-football-test
spring.data.mongodb.database=small-talk-football-test
# Must be false here. Production sets this to true, but index creation runs eagerly at
# startup and would require a reachable MongoDB just to load the context. Tests that need
# the unique indexes on User.email / Article.title / SmallInfo.title belong in the
# Testcontainers stage, which can turn this back on.
spring.data.mongodb.auto-index-creation=false

jwt.expiration=720

api.football.key=test-api-football-key

max.match.days=7
match.days.into.future=7

spring.ai.openai.api-key=test-openai-key
spring.ai.openai.chat.options.model=gpt-5.1

email.api.key=test-email-key
